[tool.ruff]
# Длина строки (стандарт — 88 или 100)
line-length = 100

# Папки, которые Ruff не должен проверять (миграции проверять не нужно!)
exclude = [
    "migrations",
    "venv",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
# Список правил, которые нужно проверять
# E, F — ошибки и советы Pyflakes/Pycodestyle
# I — автоматическая сортировка импортов (как в isort)
select = ["E", "F", "I"]

# Игнорировать определенные ошибки (если нужно)
ignore = []

[tool.ruff.lint.isort]
# Чтобы импорты внутри Django-приложений группировались правильно
known-first-party = ["events", "api"] # добавьте сюда имена своих приложений